<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check In</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08101b;
      --panel: #0f1c28;
      --panel-strong: #142733;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e9edf2;
      --muted: #95a0b7;
      --accent: #5b8cff;
      --accent-strong: #72a8ff;
      --shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(91, 140, 255, 0.15), transparent 35%),
                  linear-gradient(180deg, #060b12 0%, #08101b 100%);
      color: var(--text);
    }

    .page {
      width: min(540px, calc(100vw - 32px));
      padding: 32px;
      background: linear-gradient(180deg, rgba(14, 24, 36, 0.95), rgba(10, 18, 28, 0.95));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .page header {
      margin-bottom: 28px;
    }

    .page header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.85rem, 2.6vw, 2.5rem);
      letter-spacing: -0.03em;
    }

    .page header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .section {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 10px;
    }

    label {
      font-size: 0.95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    input[type="date"]:focus,
    input[type="time"]:focus {
      border-color: rgba(91, 140, 255, 0.65);
      background: rgba(91, 140, 255, 0.08);
    }

    .form-panel {
      padding: 24px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .form-panel h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .submit-row {
      display: flex;
      justify-content: flex-end;
    }

    input[type="submit"] {
      padding: 14px 24px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 12px 30px rgba(91, 140, 255, 0.24);
    }

    input[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 38px rgba(91, 140, 255, 0.28);
    }

    .flash-message {
      padding: 16px 20px;
      border-radius: 18px;
      background: rgba(40, 72, 107, 0.18);
      border: 1px solid rgba(91, 140, 255, 0.2);
      color: #d7e7ff;
      margin-bottom: 18px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flash-message.success {
      background: rgba(56, 102, 180, 0.22);
      border-color: rgba(91, 140, 255, 0.3);
    }

    @media (max-width: 520px) {
      .page {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Check In</h1>
      <p>Start your work session with a quick check-in.</p>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form class="form-panel" action="/checkin" method="post">
      <h2>Check In</h2>

      <div class="field">
        <label for="checkinDate">Date</label>
        <input type="date" id="checkinDate" name="checkin_date" required>
      </div>

      <div class="field">
        <label for="checkinStart">Start time</label>
        <input type="time" id="checkinStart" name="start_time" required>
      </div>

      <div class="field">
        <label for="checkinExpected">Expected end time</label>
        <input type="time" id="checkinExpected" name="expected_end_time" required>
      </div>

      <div class="submit-row">
        <input type="submit" value="Check In">
      </div>
    </form>
  </main>

  <script>
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('checkinDate').value = today;
  </script>
</body>
</html>
