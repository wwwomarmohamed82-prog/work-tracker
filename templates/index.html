<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Log</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08101b;
      --panel: #0f1c28;
      --panel-strong: #142733;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e9edf2;
      --muted: #95a0b7;
      --accent: #5b8cff;
      --accent-strong: #72a8ff;
      --danger: #f76d6d;
      --shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(91, 140, 255, 0.15), transparent 35%),
                  linear-gradient(180deg, #060b12 0%, #08101b 100%);
      color: var(--text);
    }

    .page {
      width: min(520px, calc(100vw - 32px));
      padding: 32px;
      background: linear-gradient(180deg, rgba(14, 24, 36, 0.95), rgba(10, 18, 28, 0.95));
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .page header {
      margin-bottom: 28px;
    }

    .page header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.75rem, 2.6vw, 2.3rem);
      letter-spacing: -0.03em;
    }

    .page header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    form {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 0.95rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    input[type="date"]:focus,
    input[type="time"]:focus {
      border-color: rgba(91, 140, 255, 0.65);
      background: rgba(91, 140, 255, 0.08);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .submit-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .flash-message {
      padding: 16px 20px;
      border-radius: 18px;
      background: rgba(40, 72, 107, 0.18);
      border: 1px solid rgba(91, 140, 255, 0.2);
      color: #d7e7ff;
      margin-bottom: 18px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flash-message.success {
      background: rgba(56, 102, 180, 0.22);
      border-color: rgba(91, 140, 255, 0.3);
    }

    input[type="submit"] {
      padding: 14px 24px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 12px 30px rgba(91, 140, 255, 0.24);
    }

    input[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 38px rgba(91, 140, 255, 0.28);
    }

    input[type="submit"]:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .hint {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: -6px;
    }

    @media (max-width: 520px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Work Log Reminder</h1>
      <p>Enter your shift dates and times below.</p>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/submit" method="post">
      <div class="row">
        <div class="field">
          <label for="sday">Start working day</label>
          <input type="date" id="sday" name="sday">
        </div>

        <div class="field">
          <label for="lday">End working day</label>
          <input type="date" id="lday" name="lday">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="stime">Select start time</label>
          <input type="time" id="stime" name="stime">
        </div>

        <div class="field">
          <label for="etime">Select end time</label>
          <input type="time" id="etime" name="etime">
        </div>
      </div>

      <div class="submit-row">
        <input type="submit" value="Submit" id="submitBtn">
      </div>
    </form>
  </main>

  <script>
    const form = document.querySelector('form');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', () => {
      submitBtn.value = 'Submitting...';
      submitBtn.disabled = true;
    });
  </script>
</body>
</html>
